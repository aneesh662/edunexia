{% extends "base.html" %}{% block title %}Edit account — Edunexia{% endblock %}{% block content %}
<div class="mb-4"><a href="{{ url_for('manage_users') }}" class="small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to users</a><p class="eyebrow mt-3 mb-1">ADMIN ACCOUNT MANAGEMENT</p><h1 class="fw-bold">Edit account</h1><p class="text-secondary">Leave the new password empty to keep the current password.</p></div>
<div class="panel p-4" style="max-width:720px"><form method="post"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ user.name }}" required></div><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ user.username }}" required></div><div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="password" minlength="8" autocomplete="new-password"><div class="form-text">At least 8 characters. Applies only when entered.</div></div><div class="mb-3"><label class="form-label">Role</label><select class="form-select" name="role"><option value="admin" {{ 'selected' if user.role=='admin' else '' }}>Administrator</option><option value="instructor" {{ 'selected' if user.role=='instructor' else '' }}>Instructor</option><option value="student" {{ 'selected' if user.role=='student' else '' }}>Student</option></select></div><div class="form-check form-switch mb-4"><input class="form-check-input" type="checkbox" name="active" value="1" id="active" {{ 'checked' if user.active else '' }}><label class="form-check-label" for="active">Account active</label></div><button class="btn btn-primary">Save changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('manage_users') }}">Cancel</a></form></div>{% endblock %}
