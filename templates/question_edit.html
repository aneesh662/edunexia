{% extends "base.html" %}{% block title %}Edit exam question — EDUNEXIA{% endblock %}{% block content %}<a class="small text-decoration-none" href="{{ url_for('edit_course',course_id=question.course_id) }}">← Back to course</a><div class="panel p-4 mt-3"><p class="eyebrow">COURSE BUILDER</p><h1 class="h3 fw-bold">Edit exam question</h1><form method="post"><div class="mb-3"><label class="form-label">Question</label><textarea class="form-control" name="question" rows="3" required>{{ question.question }}</textarea></div>{% for letter in ['a','b','c','d'] %}<div class="mb-3"><label class="form-label">Option {{ letter|upper }}</label><input class="form-control" name="option_{{ letter }}" value="{{ question['option_' ~ letter] }}" required></div>{% endfor %}<div class="mb-3"><label class="form-label">Correct answer</label><select class="form-select" name="correct_option">{% for letter in ['a','b','c','d'] %}<option value="{{ letter }}" {{ 'selected' if question.correct_option==letter else '' }}>Option {{ letter|upper }}</option>{% endfor %}</select></div><button class="btn btn-primary">Save question</button></form></div>{% endblock %}
