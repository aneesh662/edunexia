{% extends "base.html" %}{% block title %}Edit lesson — EDUNEXIA{% endblock %}{% block content %}<a class="small text-decoration-none" href="{{ url_for('edit_course',course_id=lesson.course_id) }}">← Back to course</a><div class="panel p-4 mt-3"><p class="eyebrow">COURSE BUILDER</p><h1 class="h3 fw-bold">Edit lesson</h1><form method="post" enctype="multipart/form-data"><div class="mb-3"><label class="form-label">Lesson title</label><input class="form-control" name="title" value="{{ lesson.title }}" required></div><div class="mb-3"><label class="form-label">Lesson notes / instructions</label><textarea class="form-control" name="content" rows="5">{{ lesson.content }}</textarea></div><div class="mb-3"><label class="form-label">Replace video/PDF (optional)</label><input class="form-control" type="file" name="material" accept=".pdf,.mp4,.webm,.mov,.m4v"><div class="form-text">Current material: {{ lesson.file_type or 'No file attached' }}. Leave blank to keep the existing file.</div></div><button class="btn btn-primary">Save lesson</button></form></div>{% endblock %}
