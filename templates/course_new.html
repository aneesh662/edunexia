{% extends "base.html" %}{% block title %}Create course — Edunexia{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="panel p-4 p-md-5"><p class="eyebrow mb-1">COURSE BUILDER</p><h1 class="fw-bold">Create a course</h1><p class="text-secondary">After creating it, you can add video/PDF lessons and exam questions.</p><form method="post"><div class="mb-3"><label class="form-label">Course title</label><input class="form-control" name="title" required></div><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4"></textarea></div><div class="mb-4"><label class="form-label">Assign instructor</label><select class="form-select" name="instructor_id"><option value="">Not assigned</option>{% for i in instructors %}<option value="{{ i.id }}">{{ i.name }} ({{ i.username }})</option>{% endfor %}</select></div><button class="btn btn-primary">Create and add lessons</button><a class="btn btn-outline-secondary ms-2" href="{{ url_for('dashboard') }}">Cancel</a></form></div></div></div>{% endblock %}
